<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jovian Drift SOS</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <iframe id="bg-frame" src="./styles/effect.html"></iframe>

    <form method="post" action="#">

        <fieldset>
            <legend>Pilot Credentials</legend>

            <label for="pilot-name">Pilot Name:</label>
            <input
                type="text"
                id="pilot-name"
                name="pilot_name"
                placeholder="Enter name"
                value="Tornike Dachiberidze"
                required
            >

            <label for="access-code">Access Code:</label>
            <input
                type="password"
                id="access-code"
                name="access_code"
                value="Europa-47X"
                required
            >

            <label for="command-email">Command Email:</label>
            <input
                type="email"
                id="command-email"
                name="email"
                value="TornikeDachiberidze@gmail.com"
                required
            >
        </fieldset>

        <fieldset>
            <legend>Vessel Diagnostics</legend>

            <label for="hull-damage">Hull Damage (%):</label>
            <input
                type="number"
                id="hull-damage"
                name="hull_damage"
                value="68"
                required
            >

            <label for="emergency-level">Emergency Level:</label>
            <select
                id="emergency-level"
                name="emergency_level"
                required
            >
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high" selected>High</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Mission Log & Evidence</legend>

            <label for="sos-message">SOS Message:</label>
            <textarea
                id="sos-message"
                name="sos_message"
                rows="3"
                required
            >Severe system failure after orbital drift near Jupiter. Hull integrity compromised, oxygen reserves critical. Immediate rescue required.</textarea>

            <div>
                <input
                    type="checkbox"
                    id="quarantine"
                    name="quarantine_agreement"
                    checked
                    required
                >
                <label for="quarantine">
                    I agree to quarantine protocols.
                </label>
            </div>
        </fieldset>

        <button type="submit">INITIATE TRANSMISSION</button>
        <button type="reset">RESET SYSTEM</button>

    </form>

    <script src="./scripts/launch.js"></script>
</body>
</html>
